name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer

jobs:
  test:
    name: Build and test (macOS)
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain versions
        run: |
          xcodebuild -version
          swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  build-platforms:
    name: Build (${{ matrix.platform }})
    runs-on: macos-15
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: iOS
            destination: generic/platform=iOS Simulator
          - platform: watchOS
            destination: generic/platform=watchOS Simulator
          - platform: tvOS
            destination: generic/platform=tvOS Simulator
    steps:
      - uses: actions/checkout@v4
      - name: Build RecurrenceKit
        run: |
          xcodebuild build \
            -scheme RecurrenceKit \
            -destination "${{ matrix.destination }}" \
            -skipPackageUpdateValidation \
            CODE_SIGNING_ALLOWED=NO

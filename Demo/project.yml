name: Demo
options:
  bundleIdPrefix: com.recurrencekit
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
packages:
  RecurrenceKit:
    path: ../
targets:
  Demo:
    type: application
    platform: iOS
    sources:
      - Demo
    settings:
      INFOPLIST_FILE: ""
      GENERATE_INFOPLIST_FILE: YES
      MARKETING_VERSION: "1.0"
      CURRENT_PROJECT_VERSION: "1"
      SWIFT_VERSION: "6.0"
    dependencies:
      - package: RecurrenceKit
